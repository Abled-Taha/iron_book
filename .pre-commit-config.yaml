repos:
  # Secret Scanning (Prevent hardcoded credentials/keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Standard repository hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Local cargo checks for Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path apps/api/Cargo.toml -- --check
        language: system
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path apps/api/Cargo.toml -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: sqlx-prepare
        name: sqlx prepare
        entry: mise run //apps/api:db:prepare
        language: system
        types: [rust]
        pass_filenames: false

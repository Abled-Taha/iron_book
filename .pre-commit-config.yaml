repos:
  # Secret Scanning (Prevent hardcoded credentials/keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Standard repository hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Local cargo checks for Rust
  - repo: local
    hooks:
      - id: api-tests
        name: api tests
        entry: mise run //apps/api:test-full
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path apps/api/Cargo.toml -- --check
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path apps/api/Cargo.toml -- -D warnings #-W clippy::pedantic
        language: system
        types: [rust]
        pass_filenames: false

      - id: sqlx-prepare
        name: sqlx prepare
        entry: bash -c 'mise run //apps/api:db:prepare && git diff --quiet apps/api/.sqlx'
        language: system
        types: [rust]
        pass_filenames: false

  # Local NextJS checks
  - repo: local
    hooks:
      - id: next-prettier
        name: next prettier check
        entry: bash -c 'cd apps/home && pnpm exec prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}" --write'
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json]
        pass_filenames: false

      - id: next-eslint
        name: next lint
        entry: bash -c 'cd apps/home && pnpm run lint'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: next-type-check
        name: next type check
        entry: bash -c 'cd apps/home && pnpm exec tsc --noEmit'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: home-tests
        name: home tests
        entry: mise run //apps/home:test
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

  # Local Django checks
  - repo: local
    hooks:
      - id: django-ruff-format
        name: django ruff format
        entry: bash -c 'cd apps/web && uv run ruff format . && git diff --quiet .'
        language: system
        types: [python]
        pass_filenames: false

      - id: django-ruff-lint
        name: django ruff lint
        entry: bash -c 'cd apps/web && uv run ruff check --fix && git diff --quiet .'
        language: system
        types: [python]
        pass_filenames: false

        # 2. Django Model Migration Check (Fails if models changed without running makemigrations)
      - id: django-check-migrations
        name: django check missing migrations
        entry: bash -c 'cd apps/web && uv run python manage.py makemigrations --check --dry-run'
        language: system
        types: [python]
        pass_filenames: false

        # 3. Static Type Check
      - id: django-type-check
        name: django pyright check
        entry: bash -c 'cd apps/web && uv run pyright'
        language: system
        types: [python]
        pass_filenames: false

        # 4. Django Test Suite
      - id: django-tests
        name: django tests
        entry: mise run //apps/web:test
        language: system
        types: [python]
        pass_filenames: false

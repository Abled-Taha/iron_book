[project]
name = "iron_book"
version = "0.1.0"
description = "A Digital Dinancial Ledger"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "django==5.2.16",
    "django-cors-headers==4.9.0",
    "django-environ==0.13.0",
    "django-tailwind[cookiecutter,honcho,reload]==4.4.2",
    "djangorestframework==3.17.2",
    "honcho==2.0.0",
    "whitenoise==6.12.0",
    "sqlparse>=0.6.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pyright]
reportAssignmentType= "error"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iron_book.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--no-migrations",  # Skips running migrations during test DB setup for speed
    "--reuse-db",        # Reuses test DB across runs for much faster local execution
]
